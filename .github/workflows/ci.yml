name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  qa:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.0', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      # Prima di composer install: vendor/ versionato deve contenere solo le dipendenze di produzione.
      - name: Check committed vendor/
        run: php .github/scripts/check-vendor.php
      - run: composer install --no-progress
      - run: composer qa
